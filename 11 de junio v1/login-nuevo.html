<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — TrazaUrbana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0F1A;--bg2:#111827;--bg3:#1A2235;--bg4:#212d42;
  --text:#E2E8F0;--text2:#94A3B8;--text3:#4B5563;
  --border:#1E2D45;
  --accent:#3D7BFF;--accent2:#6699FF;--accentL:#1A3A8F;
  --green:#10B981;--greenD:#34D399;--red:#F87171;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:36px 32px;max-width:380px;width:100%}
.logo{text-align:center;margin-bottom:6px;font-family:'Outfit','Helvetica Neue',Arial,sans-serif;font-size:22px}
.logo-sub{text-align:center;font-size:11px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:28px}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;font-family:var(--sans);margin-bottom:14px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--accent)}
button{width:100%;padding:11px;border-radius:8px;border:none;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;margin-bottom:10px}
.btn-primary:hover{background:#2D6AEE}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-link{background:none;color:var(--text2);font-size:13px;text-decoration:underline;padding:6px}
.btn-link:hover{color:var(--accent2)}
.password-block{display:none;margin-top:4px;padding-top:14px;border-top:1px solid var(--border)}
.password-block.show{display:block}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.msg.ok{background:#064E3B;border:1px solid #065F46;color:var(--greenD);display:block}
.msg.err{background:#450A0A;border:1px solid #7F1D1D;color:var(--red);display:block}
.footer-note{text-align:center;font-size:11px;color:var(--text3);margin-top:20px;font-family:var(--mono)}
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span style="font-weight:800;color:var(--text)">Traza</span><span style="font-weight:300;color:#D85A30">Urbana</span></div>
  <div class="logo-sub">Entrar a tu cuenta</div>

  <div id="msg-box"></div>

  <form id="form-magico">
    <label for="email-magico">Correo electrónico</label>
    <input type="email" id="email-magico" placeholder="tu@correo.com" required autocomplete="email">
    <button type="submit" class="btn-primary" id="btn-magico">Enviarme un link para entrar</button>
  </form>

  <button type="button" class="btn-link" id="toggle-password" style="width:100%">¿Prefieres usar una contraseña?</button>

  <div class="password-block" id="password-block">
    <form id="form-password">
      <label for="email-password">Correo electrónico</label>
      <input type="email" id="email-password" placeholder="tu@correo.com" required autocomplete="email">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      <button type="submit" class="btn-primary" id="btn-password">Iniciar sesión</button>
    </form>
  </div>

  <div class="footer-note">TrazaUrbana · Jalisco AMG</div>
</div>

<script>
const SUPABASE_URL = 'https://bhryrrdygghhospfqgtj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ma2gxSyWx4rDHIbDPKGUdg_lO0xZeZr';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function mostrarMensaje(texto, tipo) {
  const box = document.getElementById('msg-box');
  box.innerHTML = '<div class="msg ' + tipo + '">' + texto + '</div>';
}

document.getElementById('toggle-password').addEventListener('click', function () {
  const block = document.getElementById('password-block');
  const showing = block.classList.toggle('show');
  this.textContent = showing ? '¿Prefieres el link mágico?' : '¿Prefieres usar una contraseña?';
});

document.getElementById('form-magico').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email-magico').value.trim();
  const btn = document.getElementById('btn-magico');
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  const { error } = await supabaseClient.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: window.location.origin + '/login-nuevo.html' + window.location.search }
  });
  if (error) {
    mostrarMensaje('No se pudo enviar el link: ' + error.message, 'err');
  } else {
    mostrarMensaje('Listo — revisa tu correo (' + email + ') y da clic al link para entrar.', 'ok');
  }
  btn.disabled = false;
  btn.textContent = 'Enviarme un link para entrar';
});

document.getElementById('form-password').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email-password').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-password');
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  const { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
  if (error) {
    mostrarMensaje('No se pudo entrar: ' + error.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
  // Si funciona, onAuthStateChange (abajo) se encarga de redirigir.
});

supabaseClient.auth.onAuthStateChange(function (event, session) {
  if (event === 'SIGNED_IN' && session) {
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || 'index.html';
  }
});
</script>

</body>
</html>
