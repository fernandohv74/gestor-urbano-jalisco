<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — TrazaUrbana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0F1A;--bg2:#111827;--bg3:#1A2235;--bg4:#212d42;
  --text:#E2E8F0;--text2:#94A3B8;--text3:#4B5563;
  --border:#1E2D45;
  --accent:#3D7BFF;--accent2:#6699FF;--accentL:#1A3A8F;
  --green:#10B981;--greenD:#34D399;--red:#F87171;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:36px 32px;max-width:380px;width:100%}
.logo{text-align:center;margin-bottom:6px;font-family:'Outfit','Helvetica Neue',Arial,sans-serif;font-size:22px}
.logo-sub{text-align:center;font-size:11px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:28px}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;font-family:var(--sans);margin-bottom:14px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--accent)}
button{width:100%;padding:11px;border-radius:8px;border:none;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;margin-bottom:10px}
.btn-primary:hover{background:#2D6AEE}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-link{background:none;color:var(--text2);font-size:13px;text-decoration:underline;padding:6px}
.btn-link:hover{color:var(--accent2)}
.password-block{display:none;margin-top:4px;padding-top:14px;border-top:1px solid var(--border)}
.password-block.show{display:block}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.msg.ok{background:#064E3B;border:1px solid #065F46;color:var(--greenD);display:block}
.msg.err{background:#450A0A;border:1px solid #7F1D1D;color:var(--red);display:block}
.footer-note{text-align:center;font-size:11px;color:var(--text3);margin-top:20px;font-family:var(--mono)}
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span style="font-weight:800;color:var(--text)">Traza</span><span style="font-weight:300;color:#D85A30">Urbana</span></div>
  <div class="logo-sub">Entrar o crear tu cuenta</div>

  <div id="msg-box"></div>

  <form id="form-unico">
    <label for="email-unico">Correo electrónico</label>
    <input type="email" id="email-unico" placeholder="tu@correo.com" required autocomplete="email">
    <label for="password-unico">Contraseña</label>
    <input type="password" id="password-unico" placeholder="Mínimo 8 caracteres" required autocomplete="current-password" minlength="8">
    <button type="submit" class="btn-primary" id="btn-continuar">Continuar</button>
  </form>

  <div class="footer-note" style="margin-top:14px">Si es tu primera vez, esto crea tu cuenta con esa contraseña. Si ya tienes cuenta, entras directo.</div>

  <div class="footer-note">TrazaUrbana · Jalisco AMG</div>
</div>

<script>
const SUPABASE_URL = 'https://bhryrrdygghhospfqgtj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ma2gxSyWx4rDHIbDPKGUdg_lO0xZeZr';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function mostrarMensaje(texto, tipo) {
  const box = document.getElementById('msg-box');
  box.innerHTML = '<div class="msg ' + tipo + '">' + texto + '</div>';
}

document.getElementById('form-unico').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email-unico').value.trim();
  const password = document.getElementById('password-unico').value;
  const btn = document.getElementById('btn-continuar');
  btn.disabled = true;
  btn.textContent = 'Verificando…';
  document.getElementById('msg-box').innerHTML = '';

  // 1) ¿Ya tiene cuenta con esa contraseña? Si funciona, onAuthStateChange redirige.
  const login = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
  if (!login.error) {
    return;
  }

  // 2) No entró. Puede ser correo nuevo (lo creamos) o correo existente con
  // contraseña equivocada. signUp() con un correo ya registrado y confirmado
  // no da error — responde "éxito" pero con identities: [] (patrón oficial
  // de Supabase para no revelar si un correo existe).
  btn.textContent = 'Un momento…';
  const registro = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: { emailRedirectTo: window.location.origin + '/login-nuevo.html' + window.location.search }
  });

  if (registro.error) {
    mostrarMensaje('No se pudo continuar: ' + registro.error.message, 'err');
  } else if (registro.data && registro.data.user && Array.isArray(registro.data.user.identities) && registro.data.user.identities.length === 0) {
    mostrarMensaje('Ese correo ya tiene cuenta y la contraseña no coincide. Verifica o usa "¿Olvidaste tu contraseña?".', 'err');
  } else {
    mostrarMensaje('Listo — revisa tu correo (' + email + ') y da clic para confirmar tu cuenta nueva. Tu contraseña ya quedó lista, no hace falta crearla de nuevo.', 'ok');
    document.getElementById('form-unico').reset();
  }

  btn.disabled = false;
  btn.textContent = 'Continuar';
});

supabaseClient.auth.onAuthStateChange(function (event, session) {
  if (event === 'SIGNED_IN' && session) {
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || 'index.html';
  }
});
</script>

</body>
</html>
