<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — TrazaUrbana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0F1A;--bg2:#111827;--bg3:#1A2235;--bg4:#212d42;
  --text:#E2E8F0;--text2:#94A3B8;--text3:#4B5563;
  --border:#1E2D45;
  --accent:#3D7BFF;--accent2:#6699FF;--accentL:#1A3A8F;
  --green:#10B981;--greenD:#34D399;--red:#F87171;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:36px 32px;max-width:380px;width:100%}
.logo{text-align:center;margin-bottom:6px;font-family:'Outfit','Helvetica Neue',Arial,sans-serif;font-size:22px}
.logo-sub{text-align:center;font-size:11px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:28px}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;font-family:var(--sans);margin-bottom:14px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--accent)}
.pass-wrap{position:relative;margin-bottom:14px}
.pass-wrap input{margin-bottom:0;padding-right:40px}
.pass-toggle{position:absolute;right:2px;top:0;height:100%;display:flex;align-items:center;width:auto;background:none;border:none;padding:0 10px;cursor:pointer;font-size:15px;color:var(--text2)}
.pass-toggle:hover{color:var(--accent2)}
.email-wrap{position:relative;margin-bottom:14px}
.email-wrap input{margin-bottom:0;padding-right:34px}
.clear-btn{position:absolute;right:2px;top:0;height:100%;display:flex;align-items:center;width:auto;background:none;border:none;padding:0 10px;cursor:pointer;font-size:14px;color:var(--text2)}
.clear-btn:hover{color:var(--red)}
button{width:100%;padding:11px;border-radius:8px;border:none;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;margin-bottom:10px}
.btn-primary:hover{background:#2D6AEE}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent2)}
.btn-link{background:none;color:var(--text2);font-size:13px;text-decoration:underline;padding:6px}
.btn-link:hover{color:var(--accent2)}
.divider{border-top:1px solid var(--border);margin:22px 0 16px}
.cta-alt{text-align:center}
.cta-alt-txt{font-size:12px;color:var(--text2);margin-bottom:10px}
.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.msg.ok{background:#064E3B;border:1px solid #065F46;color:var(--greenD);display:block}
.msg.err{background:#450A0A;border:1px solid #7F1D1D;color:var(--red);display:block}
.footer-note{text-align:center;font-size:11px;color:var(--text3);margin-top:20px;font-family:var(--mono)}
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span style="font-weight:800;color:var(--text)">Traza</span><span style="font-weight:300;color:#D85A30">Urbana</span></div>
  <div class="logo-sub" id="modo-titulo">Iniciar sesión</div>

  <div id="msg-box"></div>

  <div id="bloque-login">
    <form id="form-login">
      <label for="email-login">Correo electrónico</label>
      <div class="email-wrap">
        <input type="email" id="email-login" placeholder="tu@correo.com" required autocomplete="email">
        <button type="button" class="clear-btn" onclick="limpiarCampo('email-login')" aria-label="Borrar correo" tabindex="-1">✕</button>
      </div>
      <label for="password-login">Contraseña</label>
      <div class="pass-wrap">
        <input type="password" id="password-login" placeholder="Tu contraseña" required autocomplete="current-password">
        <button type="button" class="pass-toggle" onclick="togglePass(this,'password-login')" aria-label="Mostrar contraseña">👁</button>
      </div>
      <button type="submit" class="btn-primary" id="btn-login">Iniciar sesión</button>
    </form>

    <button type="button" class="btn-link" id="btn-olvide-pass" style="width:100%">¿Olvidaste tu contraseña?</button>

    <div class="divider"></div>
    <div class="cta-alt">
      <div class="cta-alt-txt">¿Primera vez en TrazaUrbana?</div>
      <button type="button" class="btn-outline" id="btn-ir-registro">Crear cuenta nueva</button>
    </div>
  </div>

  <div id="bloque-registro" style="display:none">
    <form id="form-registro">
      <label for="email-registro">Correo electrónico</label>
      <div class="email-wrap">
        <input type="email" id="email-registro" placeholder="tu@correo.com" required autocomplete="email">
        <button type="button" class="clear-btn" onclick="limpiarCampo('email-registro')" aria-label="Borrar correo" tabindex="-1">✕</button>
      </div>
      <label for="password-registro">Crea una contraseña</label>
      <div class="pass-wrap">
        <input type="password" id="password-registro" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" minlength="8">
        <button type="button" class="pass-toggle" onclick="togglePass(this,'password-registro')" aria-label="Mostrar contraseña">👁</button>
      </div>
      <label for="password-registro2">Confirmar contraseña</label>
      <div class="pass-wrap">
        <input type="password" id="password-registro2" placeholder="Repite la contraseña" required autocomplete="new-password" minlength="8">
        <button type="button" class="pass-toggle" onclick="togglePass(this,'password-registro2')" aria-label="Mostrar contraseña">👁</button>
      </div>
      <button type="submit" class="btn-primary" id="btn-registro">Crear mi cuenta</button>
    </form>

    <button type="button" class="btn-link" id="btn-ir-login" style="width:100%;margin-top:4px">← Ya tengo cuenta, iniciar sesión</button>
  </div>

  <div class="footer-note">TrazaUrbana · Jalisco AMG</div>
</div>

<script>
const SUPABASE_URL = 'https://bhryrrdygghhospfqgtj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ma2gxSyWx4rDHIbDPKGUdg_lO0xZeZr';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function mostrarMensaje(texto, tipo) {
  const box = document.getElementById('msg-box');
  box.innerHTML = '<div class="msg ' + tipo + '">' + texto + '</div>';
}

function limpiarMensaje() {
  document.getElementById('msg-box').innerHTML = '';
}

function limpiarCampo(inputId) {
  const input = document.getElementById(inputId);
  input.value = '';
  input.focus();
}

function togglePass(btnEl, inputId) {
  const input = document.getElementById(inputId);
  const mostrar = input.type === 'password';
  input.type = mostrar ? 'text' : 'password';
  btnEl.textContent = mostrar ? '🙈' : '👁';
  btnEl.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
}

function irARegistro(emailPrellenado) {
  document.getElementById('bloque-login').style.display = 'none';
  document.getElementById('bloque-registro').style.display = '';
  document.getElementById('modo-titulo').textContent = 'Crear cuenta';
  if (emailPrellenado) document.getElementById('email-registro').value = emailPrellenado;
  limpiarMensaje();
}

function irALogin(emailPrellenado) {
  document.getElementById('bloque-registro').style.display = 'none';
  document.getElementById('bloque-login').style.display = '';
  document.getElementById('modo-titulo').textContent = 'Iniciar sesión';
  if (emailPrellenado) document.getElementById('email-login').value = emailPrellenado;
  limpiarMensaje();
}

document.getElementById('btn-ir-registro').addEventListener('click', function () { irARegistro(); });
document.getElementById('btn-ir-login').addEventListener('click', function () { irALogin(); });

document.getElementById('btn-olvide-pass').addEventListener('click', async function () {
  const email = document.getElementById('email-login').value.trim();
  if (!email) {
    mostrarMensaje('Primero escribe tu correo arriba, luego dale clic a "¿Olvidaste tu contraseña?".', 'err');
    document.getElementById('email-login').focus();
    return;
  }
  const btn = this;
  btn.disabled = true;
  btn.textContent = 'Enviando…';
  limpiarMensaje();

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/configurar-contrasena.html'
  });

  if (error) {
    mostrarMensaje('No se pudo enviar el correo de recuperación: ' + error.message, 'err');
  } else {
    mostrarMensaje('Listo — revisa tu correo (' + email + ') y da clic al link para crear una contraseña nueva.', 'ok');
  }
  btn.disabled = false;
  btn.textContent = '¿Olvidaste tu contraseña?';
});

document.getElementById('form-login').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email-login').value.trim();
  const password = document.getElementById('password-login').value;
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  limpiarMensaje();

  const { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
  if (error) {
    mostrarMensaje('Correo o contraseña incorrectos. Si aún no tienes cuenta, créala abajo.', 'err');
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
  // Si funciona, onAuthStateChange (abajo) se encarga de redirigir.
});

document.getElementById('form-registro').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('email-registro').value.trim();
  const pass1 = document.getElementById('password-registro').value;
  const pass2 = document.getElementById('password-registro2').value;
  limpiarMensaje();

  if (pass1.length < 8) {
    mostrarMensaje('La contraseña debe tener al menos 8 caracteres.', 'err');
    return;
  }
  if (pass1 !== pass2) {
    mostrarMensaje('Las contraseñas no coinciden.', 'err');
    return;
  }

  const btn = document.getElementById('btn-registro');
  btn.disabled = true;
  btn.textContent = 'Creando cuenta…';

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: pass1,
    options: { emailRedirectTo: window.location.origin + '/login-nuevo.html' + window.location.search }
  });

  if (error) {
    mostrarMensaje('No se pudo crear la cuenta: ' + error.message, 'err');
  } else if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
    // signUp() con un correo ya registrado y confirmado no da error -- responde
    // "éxito" pero con identities: [] (patron oficial de Supabase para no
    // revelar si un correo existe). Lo mandamos directo a iniciar sesión.
    irALogin(email);
    mostrarMensaje('Ese correo ya tiene una cuenta. Inicia sesión en vez de crear una nueva.', 'err');
  } else {
    mostrarMensaje('Listo — revisa tu correo (' + email + ') y da clic para confirmar tu cuenta nueva.', 'ok');
    document.getElementById('form-registro').reset();
  }

  btn.disabled = false;
  btn.textContent = 'Crear mi cuenta';
});

supabaseClient.auth.onAuthStateChange(function (event, session) {
  if (event === 'SIGNED_IN' && session) {
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || 'index.html';
  }
});
</script>

</body>
</html>
