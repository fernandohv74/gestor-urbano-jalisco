<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - Juego Sencillo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #1a1a2e;
    font-family: system-ui, sans-serif;
    color: #eee;
  }
  h1 { font-size: 1.4rem; letter-spacing: 1px; }
  #score { font-size: 1.1rem; color: #4ade80; }
  canvas {
    background: #0f0f1e;
    border: 4px solid #4ade80;
    border-radius: 8px;
    image-rendering: pixelated;
  }
  #msg {
    min-height: 1.4em;
    font-size: 1rem;
    color: #f87171;
  }
  button {
    padding: 8px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #4ade80;
    color: #0f0f1e;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #86efac; }
  #hint { font-size: 0.85rem; color: #888; }
</style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div id="score">Puntos: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="msg"></div>
  <button id="restart">Reiniciar</button>
  <div id="hint">Usa las flechas (o WASD) para moverte</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const msgEl = document.getElementById('msg');
  const restartBtn = document.getElementById('restart');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  const SPEED_MS = 120;

  let snake, direction, nextDirection, food, score, gameOver, loopId, lastTime;

  function randomCell() {
    return {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS),
    };
  }

  function placeFood() {
    let cell;
    do {
      cell = randomCell();
    } while (snake.some(s => s.x === cell.x && s.y === cell.y));
    return cell;
  }

  function resetGame() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    food = placeFood();
    score = 0;
    gameOver = false;
    lastTime = 0;
    scoreEl.textContent = 'Puntos: 0';
    msgEl.textContent = '';
    if (loopId) cancelAnimationFrame(loopId);
    loopId = requestAnimationFrame(gameLoop);
  }

  function update() {
    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    const hitsWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
    const hitsSelf = snake.some(s => s.x === head.x && s.y === head.y);

    if (hitsWall || hitsSelf) {
      gameOver = true;
      msgEl.textContent = `Fin del juego - Puntos: ${score}`;
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = 'Puntos: ' + score;
      food = placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#0f0f1e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#f87171';
    ctx.fillRect(food.x * CELL, food.y * CELL, CELL - 2, CELL - 2);

    snake.forEach((segment, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(segment.x * CELL, segment.y * CELL, CELL - 2, CELL - 2);
    });
  }

  function gameLoop(timestamp) {
    if (gameOver) return;
    if (timestamp - lastTime >= SPEED_MS) {
      lastTime = timestamp;
      update();
      draw();
    }
    loopId = requestAnimationFrame(gameLoop);
  }

  const KEY_MAP = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', (e) => {
    const dir = KEY_MAP[e.key];
    if (!dir) return;
    e.preventDefault();
    const isOpposite = dir.x === -direction.x && dir.y === -direction.y;
    if (!isOpposite) nextDirection = dir;
  });

  restartBtn.addEventListener('click', resetGame);

  resetGame();
</script>
</body>
</html>
